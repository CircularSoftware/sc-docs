# Homepage hero + category-card copy. Editor-friendly: change wording here without
# touching code. sync_notion.py regenerates docs/index.md from this + the real
# categories, so cards only ever link to content that exists (keeps --strict happy).

hero:
  title: "¿En qué podemos ayudarte?"
  subtitle: "Respuestas rápidas sobre tu tienda, catálogo, ventas y facturación."

# Cierre de la portada. Dejá `whatsapp` o `email` vacíos para no mostrarlos.
contacto:
  intro: "¿No encontrás lo que buscás? Escribilo con tus propias palabras en el buscador."
  ayuda: "Si aun así no aparece, escribinos:"
  whatsapp: "+598 99 551 719"
  email: "info@softwarecircular.com"

# Per-category card copy, keyed by the Category name in Notion. Unlisted categories
# still appear, with the default icon and no description.
#
# `icon` picks one of the line icons drawn in scripts/sync_notion.py (ICONS). Available:
#   rocket, box, tag, cart, user, chart, card, receipt, globe, shield, question, file
default_icon: "file"
categories:
  "Primeros pasos":
    icon: "rocket"
    description: "Primer acceso y carga inicial de tu tienda."
  "Catálogo":
    icon: "box"
    description: "Cargar productos, fotos, categorías y etiquetas."
  "Stock":
    icon: "tag"
    description: "Unidades, cantidades y control de inventario."
  "Ventas":
    icon: "cart"
    description: "Vender, alquilar, descuentos, vales, devoluciones y caja."
  "Clientes":
    icon: "user"
    description: "Compradores, dueños y marcas de tu tienda."
  "Reportes":
    icon: "chart"
    description: "Informes de ventas, proveedores y productos."
  "Pagos":
    icon: "card"
    description: "Comisiones a proveedoras y medios de pago."
  "Facturación":
    icon: "receipt"
    description: "Facturación electrónica con Biller y comprobantes."
  "Tienda online":
    icon: "globe"
    description: "Tu web: productos, dominio, envíos y promociones."
  "Cuenta":
    icon: "shield"
    description: "Usuarios, roles y acceso de tus proveedoras."
