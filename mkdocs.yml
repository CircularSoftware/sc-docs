site_name: Centro de Ayuda
site_url: https://ayuda.softwarecircular.com

theme:
  name: material
  language: es
  custom_dir: overrides
  logo: assets/img/logo.png
  favicon: assets/img/logo.png
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.instant
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.tooltips
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Cambiar a modo oscuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Cambiar a modo claro

extra_css:
  - assets/stylesheets/extra.css
extra_javascript:
  - assets/javascripts/home-search.js
  - assets/javascripts/feedback.js

extra:
  # Dónde se registran los votos de "¿Te resultó útil?". Vacío = los botones andan
  # pero el voto no sale del navegador. Ver docs/assets/javascripts/feedback.js.
  # Web App de Apps Script que agrega una fila a la planilla "Centro de ayuda",
  # pestaña `feedback`. No es un secreto: viaja en el HTML para que el navegador
  # pueda llamarlo. Si cambia, hay que redesplegar con "Versión: Nueva" — guardar
  # el código no alcanza, el /exec sirve la versión fijada en la implementación.
  feedback_endpoint: "https://script.google.com/macros/s/AKfycbwvmfQzyHsAajLnAKPDPRXWmSW1NX2bOPA0q5OAVSW_cKPkAafyCMXIi9l5Bo-TyaX_UQ/exec"

plugins:
  - search:
      lang: es
  - awesome-pages

markdown_extensions:
  - admonition
  - pymdownx.details        # collapsible ??? admonitions for the FAQ accordion
  - pymdownx.superfences
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
